<!-- 首页 blog 卡片模板
  占位符：{date_display} {中文日期} {date} {slug} {title} {title_zh} {scaler}
  封面背景（二选一）：
    - 方形封面图：background:url(images/blog/foo-cover.png) center/cover no-repeat #000;
    - 品牌 logo：  background:url(images/gfx/5guys/logo-white.png) center/40% no-repeat #000;
  规则：只保留最新 N 篇（当前 3），新文章替换第一张卡位置，最旧一篇从首页删掉。
-->
<div class="panel journal-news homepage-news" style="background:url(images/blog/foo-cover.png) center/cover no-repeat #000;">

  <div class="inline"></div>

  <div class="panel-header">
    <div class="title" style="color:#fff;"><span class="en">{date_display}</span><span class="zh">{中文日期}</span></div>
    <div class="section-name" style="color:#fff;border-color:#fff;"><a style="color:#fff;border-color:#fff;" href="pages/blog/{date}/{slug}/index.html"><span class="en">Blog</span><span class="zh">博客</span></a></div>
  </div>

  <h2 style="color:#fff;"><span class="scaler" style="font-size: {scaler}%;"><a style="color:#fff;border-color:transparent;" href="pages/blog/{date}/{slug}/index.html"><span class="en">{title}</span><span class="zh">{title_zh}</span></a></span></h2>

  <div class="info">
    <a style="color:#fff;border-color:#fff;" href="pages/blog/{date}/{slug}/index.html" class="more"><span class="en">Read more</span><span class="zh">阅读更多</span></a>
  </div>

</div>
